name: Benchmarks

on:
  pull_request:
    paths:
      - "memex/**"
      - "benchmarks/**"
      - "tests/benchmarks/**"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[benchmark]"
      - run: python benchmarks/bench_memex.py --count 1000 --queries 25
