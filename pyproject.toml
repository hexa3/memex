[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memex-ai"
version = "0.1.1"
description = "Local-first persistent semantic memory for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "memex maintainers" }]
keywords = ["llm", "memory", "sqlite", "embeddings", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "sqlite-vec>=0.1",
  "typer>=0.12",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=2.7",
]
server = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
openai = ["openai>=1.30"]
langchain = ["langchain>=0.2"]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "fastapi>=0.111",
  "httpx>=0.27",
]
benchmark = [
  "pytest>=8.2",
  "pytest-benchmark>=4.0",
  "psutil>=5.9",
]
dev = [
  "sentence-transformers>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "openai>=1.30",
  "langchain>=0.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "psutil>=5.9",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/memex-ai/memex"
Repository = "https://github.com/memex-ai/memex"
Issues = "https://github.com/memex-ai/memex/issues"

[project.scripts]
memex = "memex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["memex"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "error",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_configs = true
packages = ["memex"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "openai.*", "fastapi.*", "uvicorn.*", "langchain.*"]
ignore_missing_imports = true
